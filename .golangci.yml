version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    presets:
      - std-error-handling
  settings:
    revive:
      rules:
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: indent-error-flow
        - name: receiver-naming
        - name: unused-parameter
        - name: var-naming

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/JakubPluta/airpeek